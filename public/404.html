<!DOCTYPE html>
<html data-theme="mona" data-mode="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breathing App</title>
    <script>
      // Single Page App for GitHub Pages
      // MIT License
      // Adapted from https://github.com/rafgraph/spa-github-pages
      (function() {
        // This script takes the current URL and redirects to the route in your SPA
        var l = window.location;
        var pathSegmentsToKeep = 1; // Keep the first segment (repo name)
        
        // Get the repository name from the current URL
        var repoName = l.pathname.split('/')[1];
        var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repoName + '/?p=';
        
        // Everything after the repository name becomes the route
        var route = l.pathname.slice(('/' + repoName).length);
        
        // Redirect with the route as a parameter
        l.replace(newUrl + encodeURIComponent(route) + l.search);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
