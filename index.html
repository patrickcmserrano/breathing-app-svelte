<!DOCTYPE html>
<html data-theme="mona" data-mode="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebOasis 4-7-8</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L0N2T9B4D6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      
      // Configuração padrão com consentimento necessário
      gtag('config', 'G-L0N2T9B4D6', {
        'cookie_flags': 'max-age=7200;secure;samesite=none',
        'anonymize_ip': true
      });
      
      // Configuração de consentimento padrão (inativo até o usuário aceitar)
      gtag('consent', 'default', {
        'analytics_storage': 'denied'
      });
    </script>
    <script>
      // Handle redirects from 404.html
      (function() {
        // Parse the URL query parameters
        var query = window.location.search.substring(1);
        var vars = query.split('&');
        var redirectRoute = null;
        
        for (var i = 0; i < vars.length; i++) {
          var pair = vars[i].split('=');
          if (decodeURIComponent(pair[0]) === 'p') {
            redirectRoute = decodeURIComponent(pair[1] || '');
            break;
          }
        }
        
        // If we have a route from the query parameter, use history API to navigate
        if (redirectRoute) {
          window.history.replaceState(null, null, 
            window.location.pathname.split('?')[0] + redirectRoute);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
