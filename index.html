<!DOCTYPE html>
<html data-theme="mona" data-mode="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breathing App</title>
    <script>
      // Handle redirects from 404.html
      (function() {
        // Parse the URL query parameters
        var query = window.location.search.substring(1);
        var vars = query.split('&');
        var redirectRoute = null;
        
        for (var i = 0; i < vars.length; i++) {
          var pair = vars[i].split('=');
          if (decodeURIComponent(pair[0]) === 'p') {
            redirectRoute = decodeURIComponent(pair[1] || '');
            break;
          }
        }
        
        // If we have a route from the query parameter, use history API to navigate
        if (redirectRoute) {
          window.history.replaceState(null, null, 
            window.location.pathname.split('?')[0] + redirectRoute);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
