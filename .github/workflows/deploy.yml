name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install
      - name: Build
        run: npm run build
      # Copy sound files to the dist directory
      - name: Copy sound files to dist
        run: |
          mkdir -p dist/sounds
          cp -r public/sounds/* dist/sounds/ || echo "Sound files already included in build"
      # List what's in the dist directory for debugging
      - name: Debug dist directory
        run: ls -la dist
      # Upload the artifact for GitHub Pages - using newer version and being explicit about name
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2